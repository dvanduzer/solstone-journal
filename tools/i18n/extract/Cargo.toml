[package]
name = "i18n-extract"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
syn = { version = "2.0.108", features = ["full", "visit", "parsing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[features]
full-tests = []
