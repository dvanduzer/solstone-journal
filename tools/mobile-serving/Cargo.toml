[package]
name = "journal-mobile-serving"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[features]
full-tests = ["solstone-core-backup-web/full-tests"]
audio-native = ["audio", "journal-mobile-audio/native"]
audio = ["dep:journal-mobile-audio", "dep:solstone-core-transcribe", "dep:sha2"]

[dependencies]
axum = { version = "0.8.9", default-features = false }
serde_json = "1"
log = "0.4"
solstone-core-backup-web = { path = "../../core/crates/solstone-core-backup-web" }
solstone-core-backup-runtime = { path = "../../core/crates/solstone-core-backup-runtime" }
solstone-core-backup = { path = "../../core/crates/solstone-core-backup" }
solstone-core-maintenance = { path = "../../core/crates/solstone-core-maintenance" }
solstone-core-spl = { path = "../../core/crates/solstone-core-spl" }
solstone-core-mcp-endpoint = { path = "../../core/crates/solstone-core-mcp-endpoint" }
solstone-core-convey-shell = { path = "../../core/crates/solstone-core-convey-shell" }
solstone-core-indexer-store = { path = "../../core/crates/solstone-core-indexer-store" }
solstone-core-journal-io = { path = "../../core/crates/solstone-core-journal-io" }
solstone-core-journal-config-write = { path = "../../core/crates/solstone-core-journal-config-write" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
journal-mobile-audio = { path = "../mobile-audio", optional = true, default-features = false }
solstone-core-transcribe = { path = "../../core/crates/solstone-core-transcribe", features = ["embedded"], optional = true }
solstone-core-callosum = { path = "../../core/crates/solstone-core-callosum" }
solstone-core-brain-owner = { path = "../../core/crates/solstone-core-brain-owner" }
solstone-core-cortex = { path = "../../core/crates/solstone-core-cortex" }
solstone-core-generate-wire = { path = "../../core/crates/solstone-core-generate-wire" }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
solstone-core-system = { path = "../../core/crates/solstone-core-system" }

[patch.crates-io]
ffmpeg-sys-next = { path = "../../core/vendor/ffmpeg-sys-next" }
