name: BackupProbe
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    GENERATE_INFOPLIST_FILE: true
    CODE_SIGN_STYLE: Automatic
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge.h
    HEADER_SEARCH_PATHS: $(BACKUP_HEADERS)
    OTHER_LDFLAGS: $(BACKUP_ARCHIVE) -framework CoreFoundation -framework Security -lresolv
    ENABLE_DEBUG_DYLIB: false
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  BackupProbe:
    type: application
    platform: iOS
    sources: [Host, Native]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.journal.backup.dev
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
schemes:
  BackupProbe:
    build:
      targets:
        BackupProbe: all
