[package]
name = "solstone-core-body-rebuild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# SQLite's descriptor-bound VFS is the only private FFI boundary.
[lints.rust]
unsafe_code = "deny"

[features]
full-tests = []

[dependencies]
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-body-source = { path = "../solstone-core-body-source" }
solstone-core-body-store = { path = "../solstone-core-body-store" }
solstone-core-journal-io.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
