<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
.map-shell {
  max-width: 1200px;
}

.map-shell[data-map-empty] [data-date-nav] {
  display: none;
}

.map-title {
  margin: 0 0 var(--space-4);
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: clamp(1.8rem, 3vw, 2.35rem);
  line-height: 1.2;
  color: var(--ink);
}

.map-card {
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
}

.map-card h2 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-body);
  font-weight: 700;
  color: var(--ink);
}

.map-muted {
  margin: var(--space-1) 0 0;
  color: var(--ink-soft);
  font-size: var(--text-small, 0.9rem);
  line-height: 1.45;
}

.map-device-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--space-2);
  align-items: baseline;
}

.map-device-head strong {
  font-size: var(--text-body);
  color: var(--ink);
}

.map-device-count {
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.map-columns {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

@media (min-width: 900px) {
  .map-columns {
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  }
  .map-figure-card {
    position: sticky;
    top: var(--space-4);
  }
}

.map-list-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-2);
}

.map-list {
  list-style: none;
  margin: var(--space-2) 0 0;
  padding: 0;
}

.map-row {
  display: grid;
  grid-template-columns: 6.6rem 1.2rem minmax(0, 1fr);
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-top: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
}

.map-row:first-child {
  border-top: 0;
}

.map-row[data-active] {
  background: var(--cream-bright);
}

.map-row-time {
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  line-height: 1.35;
}

.map-row-mark {
  width: 0.9rem;
  height: 0.9rem;
  margin-top: 0.25rem;
  border-radius: 50%;
}

.map-row-mark-readings {
  background: var(--orange);
}

.map-row-mark-approximate {
  background: transparent;
  border: 2px dashed var(--orange);
}

.map-row-mark-visit {
  background: transparent;
  border: 2px solid var(--orange);
}

.map-row-mark-unreadable {
  background: transparent;
  border: 2px dotted var(--ink-soft);
}

.map-row-title {
  margin: 0;
  font-weight: 700;
  color: var(--ink);
}

.map-row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  margin-top: var(--space-1);
}

.map-link,
.map-row-actions button {
  display: inline-flex;
  align-items: center;
  min-height: var(--touch-min);
  margin: calc((var(--touch-min) - 1.4em) / -2) 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--orange-text-aa);
  font: inherit;
  font-size: 0.9rem;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  cursor: pointer;
}

.map-pieces {
  margin-top: var(--space-1);
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.map-pieces summary {
  cursor: pointer;
}

.map-pieces ul {
  list-style: none;
  margin: var(--space-1) 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
}

.map-canvas {
  height: 420px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--panel);
}

.map-canvas .leaflet-container,
.map-canvas.leaflet-container {
  background: var(--panel);
  font: inherit;
}

.map-town-label {
  background: transparent;
  border: 0;
  box-shadow: none;
  padding: 0 0 0 2px;
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 600;
  text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper);
}

.map-town-label::before {
  display: none;
}

.map-empty-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-3);
  margin-top: var(--space-3);
}

.map-empty-actions a {
  display: inline-flex;
  align-items: center;
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  font-weight: 600;
  text-decoration: none;
}

.map-details summary {
  cursor: pointer;
  font-weight: 700;
  min-height: var(--touch-min);
  display: flex;
  align-items: center;
}

.map-details p {
  margin: var(--space-2) 0 0;
  color: var(--ink-soft);
  line-height: 1.5;
}
.map-row-where {
  margin: var(--space-1) 0 0;
  color: var(--ink);
}

.map-why {
  margin-top: var(--space-1);
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.map-why summary {
  cursor: pointer;
  min-height: var(--touch-min);
  display: inline-flex;
  align-items: center;
}

.map-why ul {
  margin: 0;
  padding-left: var(--space-4);
}

.map-accuracy-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  margin-top: var(--space-3);
}

.map-accuracy-actions button {
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.map-accuracy-actions button[data-accuracy="download"] {
  background: var(--orange);
  border-color: var(--orange);
  color: var(--paper);
}

.map-accuracy-actions button:disabled {
  opacity: 0.6;
  cursor: default;
}

.map-accuracy progress {
  width: 100%;
  margin-top: var(--space-2);
  accent-color: var(--orange);
}
</style>

<div class="workspace-content map-shell" id="map-shell">
  <div data-date-nav></div>
  <h1 class="map-title" data-date-nav-heading></h1>
  <div id="map-state-gate"></div>
  <div id="map-view-root" hidden></div>
</div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script>
(() => {
  "use strict";

  const DAY_RE = /^\d{8}$/;
  const escapeHtml = (value) => window.AppServices.escapeHtml(String(value ?? ""));
  const shell = document.getElementById("map-shell");
  const root = document.getElementById("map-view-root");
  const gate = document.getElementById("map-state-gate");
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];
  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const TIER_NAMES = {
    light: "places only",
    balanced: "places + comings and goings",
    full: "the complete picture",
  };
  let mapState = null;

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function dayDate(day) {
    if (!DAY_RE.test(String(day || ""))) return null;
    return new Date(Number(day.slice(0, 4)), Number(day.slice(4, 6)) - 1, Number(day.slice(6, 8)));
  }

  function longDay(day) {
    const date = dayDate(day);
    return date ? `${WEEKDAYS[date.getDay()]}, ${MONTHS[date.getMonth()]} ${date.getDate()}` : "";
  }

  function shortDay(day) {
    const date = dayDate(day);
    return date ? `${MONTHS[date.getMonth()].slice(0, 3)} ${date.getDate()}` : "";
  }

  function plural(count, one, many) {
    return `${count} ${count === 1 ? one : many}`;
  }

  // A time on the day being shown reads as its clock; one on another day
  // carries that day, so a visit begun the evening before says so.
  function moment(time, day) {
    if (!time) return "";
    return time.day === day ? time.clock : `${shortDay(time.day)} ${time.clock}`;
  }

  function pieceTime(segment) {
    const match = /^(\d{2})(\d{2})\d{2}_/.exec(String(segment || ""));
    return match ? `${match[1]}:${match[2]}` : String(segment || "");
  }

  function bytes(value) {
    const size = Number(value) || 0;
    if (size >= 1e9) return `${(size / 1e9).toFixed(1)} GB`;
    return `${Math.max(1, Math.round(size / 1e6))} MB`;
  }

  function listed(names) {
    if (names.length <= 1) return names.join("");
    return `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
  }

  function nearNames(place) {
    return listed(asArray(place?.near).map((near) => near.name));
  }

  function withinName(within) {
    if (!within) return "";
    return [within.neighbourhood, within.locality].filter(Boolean).join(", ");
  }

  function setGate(markup) {
    root.hidden = true;
    gate.hidden = false;
    gate.innerHTML = markup;
  }

  function reveal(markup) {
    gate.hidden = true;
    gate.innerHTML = "";
    root.innerHTML = markup;
    root.hidden = false;
  }

  function showError(err, retry) {
    if (window.logError) window.logError(err, { context: "map:day" });
    setGate(window.SurfaceState.error({
      heading: "couldn't open this day's location.",
      desc: window.CONVEY_COPY?.RELOAD_HINT,
      serverMessage: err?.serverMessage,
      detail: err,
      retry: true,
    }));
    gate.querySelector(".surface-state-retry")?.addEventListener("click", retry, { once: true });
  }

  function renderJournalEmpty() {
    shell.setAttribute("data-map-empty", "");
    setGate(window.SurfaceState.empty({
      icon: window.ConveyIcons?.svg("map-pin"),
      heading: "no location in your journal yet",
      desc: "location comes from the solstone app on your phone, once you turn it on there. whatever it takes in goes into your journal and shows up here, day by day.",
    }));
  }

  function renderDayEmpty(data, day) {
    const nearby = data.nearby || {};
    const links = [nearby.previous, nearby.next]
      .filter((value) => DAY_RE.test(String(value || "")))
      .map((value) => `<a href="/app/map/${escapeHtml(value)}">go to ${escapeHtml(longDay(value))}</a>`)
      .join("");
    setGate(window.SurfaceState.empty({
      icon: window.ConveyIcons?.svg("map-pin"),
      heading: "no location kept for this day",
      desc: `your journal has no location from ${longDay(day)}. location may have been paused or off, or the phone may not have reached your journal. your journal can't tell which.`,
    }));
    if (links) {
      const actions = document.createElement("div");
      actions.className = "map-empty-actions";
      actions.innerHTML = links;
      gate.firstElementChild?.appendChild(actions);
    }
  }

  function deviceNotes(device) {
    const notes = [];
    const word = device.word;
    const tier = TIER_NAMES[device.tier];
    if (device.platform === "android") {
      notes.push("approximate location: each reading is only good to within a few kilometres, which is enough to name the town, not the building.");
    } else if (device.platform === "watchos") {
      notes.push("your watch gives only approximate location, so its readings name the town, not the building.");
    } else if (tier) {
      notes.push(`detail level in the solstone app: <strong>${escapeHtml(tier)}</strong>.`);
    }
    if (device.precision_reduced) {
      notes.push(`precise location is off for solstone on your ${escapeHtml(word)}, so its readings name the town, not the building.`);
    }
    if (device.interrupted_segments > 0) {
      notes.push(`your ${escapeHtml(word)} said location was interrupted ${device.interrupted_segments === 1 ? "once" : `${device.interrupted_segments} times`} this day.`);
    }
    return notes;
  }

  function renderDevice(device, day) {
    const counts = [];
    if (device.readings) counts.push(plural(device.readings, "reading", "readings"));
    if (device.visits) counts.push(plural(device.visits, "visit", "visits"));
    if (device.first && device.last && device.readings > 1) {
      counts.push(`${moment(device.first, day)} to ${moment(device.last, day)}`);
    }
    const notes = deviceNotes(device).map((note) => `<p class="map-muted">${note}</p>`).join("");
    return `<section class="map-card" aria-label="from ${escapeHtml(device.phrase)}">
      <div class="map-device-head"><strong>from ${escapeHtml(device.phrase)}</strong>
      <span class="map-device-count">${escapeHtml(counts.join(" · "))}</span></div>${notes}</section>`;
  }

  function entryTitle(entry) {
    if (entry.kind === "unreadable") {
      return entry.whole_file
        ? "a segment your journal couldn't read"
        : `${plural(entry.lines, "line", "lines")} your journal couldn't read`;
    }
    const place = entry.kind === "visit" ? entry.place : null;
    if (place?.at) return `at ${place.at.name}`;
    if (asArray(place?.near).length) return `near ${nearNames(place)}`;
    return entry.area?.label || "no named town nearby";
  }

  // Under a visit named by the download: where it was, then what was near.
  function entryWhere(entry) {
    const place = entry.kind === "visit" ? entry.place : null;
    if (!place) return [];
    const lines = [];
    if (place.at?.inside) lines.push(`in ${place.at.inside}`);
    if (entry.area?.label) lines.push(entry.area.label);
    const where = [lines.join(" · ")];
    if (place.at && asArray(place.near).length) where.push(`near ${nearNames(place)}`);
    return where.filter(Boolean);
  }

  // The reasons behind a record's words, from the map and the phone's own
  // margin of error.
  function entryWhy(entry, data) {
    const reasons = [];
    const place = entry.kind === "visit" ? entry.place : null;
    const margin = place?.margin_m;
    if (place?.at) {
      reasons.push(`your phone placed you within ${margin} m, and all of that is inside ${place.at.name}.`);
    }
    asArray(place?.near).forEach((near) => {
      const what = near.category ? ` (${near.category})` : "";
      reasons.push(`${near.name}${what} is ${near.distance_m} m away; your phone placed you within ${margin} m.`);
    });
    const within = withinName(entry.area?.within);
    if (within) {
      reasons.push(margin
        ? `that whole area is inside ${within}.`
        : entry.kind === "readings"
          ? `every reading here, with its margin of error, is inside ${within}.`
          : `your phone's position, with its margin of error, is inside ${within}.`);
    } else if (entry.area?.town && entry.kind !== "unreadable") {
      reasons.push(`${entry.area.town} is the town that best stands for this area, ${entry.area.town_km} km away.`);
    }
    const accuracy = entry.kind === "visit" ? entry.point?.[2] : null;
    if (entry.kind === "visit" && !place && data.accuracy?.installed && Number.isFinite(accuracy) && accuracy > 100) {
      reasons.push(`your phone placed you within ${accuracy} m, too wide to name a building or the places nearby.`);
    }
    return reasons;
  }

  function entryTime(entry, day) {
    if (entry.kind === "readings") {
      return entry.count === 1
        ? moment(entry.first, day)
        : `${moment(entry.first, day)}–\u200b${moment(entry.last, day)}`;
    }
    if (entry.kind === "visit") {
      return `${entry.arrival ? moment(entry.arrival, day) : "…"}–\u200b${entry.departure ? moment(entry.departure, day) : "…"}`;
    }
    return entry.at ? moment(entry.at, day) : "";
  }

  function entryMeta(entry, data) {
    const device = asArray(data.devices)[entry.device] || {};
    const many = asArray(data.devices).length > 1;
    const parts = [];
    if (entry.kind === "readings") {
      parts.push(plural(entry.count, "reading", "readings"));
      if (entry.precision === "approximate" || entry.precision === "reduced") parts.push("approximate");
      if (many) parts.push(`from ${device.phrase}`);
    } else if (entry.kind === "visit") {
      parts.push(`a visit ${device.phrase} reported`);
      parts.push(entry.arrival ? `arrived ${moment(entry.arrival, data.day)}` : "arrival not known");
      parts.push(entry.departure ? `left ${moment(entry.departure, data.day)}` : "no departure reported");
    } else {
      parts.push(`from ${device.phrase}`);
      parts.push("open it in transcripts to see or delete it");
    }
    return parts.join(" · ");
  }

  function entryActions(entry, index) {
    const segments = asArray(entry.segments);
    const actions = [];
    if (entry.kind !== "unreadable") {
      actions.push(`<button type="button" data-map-show="${index}">show on the map</button>`);
    }
    if (segments.length === 1) {
      actions.push(`<a class="map-link" href="${escapeHtml(segments[0].url)}">open in transcripts</a>`);
    }
    let pieces = "";
    if (segments.length > 1) {
      const items = segments
        .map((segment) => `<li><a class="map-link" href="${escapeHtml(segment.url)}">${escapeHtml(pieceTime(segment.segment))}</a></li>`)
        .join("");
      pieces = `<details class="map-pieces"><summary>open in transcripts: ${segments.length} segments</summary><ul>${items}</ul></details>`;
    }
    return `<div class="map-row-actions">${actions.join("")}</div>${pieces}`;
  }

  function markClass(entry) {
    if (entry.kind === "readings") {
      return entry.precision === "precise" ? "map-row-mark-readings" : "map-row-mark-approximate";
    }
    return `map-row-mark-${entry.kind}`;
  }

  function renderEntry(entry, index, data) {
    const where = entryWhere(entry).map((line) => `<p class="map-row-where">${escapeHtml(line)}</p>`).join("");
    const reasons = entryWhy(entry, data);
    const why = reasons.length
      ? `<details class="map-why"><summary>why these words</summary><ul>${reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join("")}</ul></details>`
      : "";
    return `<li class="map-row" data-map-entry="${index}">
      <span class="map-row-time">${escapeHtml(entryTime(entry, data.day))}</span>
      <span class="map-row-mark ${markClass(entry)}" aria-hidden="true"></span>
      <div><p class="map-row-title">${escapeHtml(entryTitle(entry))}</p>${where}
      <p class="map-muted">${escapeHtml(entryMeta(entry, data))}</p>${why}${entryActions(entry, index)}</div></li>`;
  }

  function accuracyCard(status) {
    if (!status) return "";
    const offered = status.offered;
    const installed = status.installed;
    const job = status.job || {};
    if (!offered && !installed) return "";
    const outlines = asArray(offered?.files).includes("containment.slpk") || installed?.containment;
    const what = outlines
      ? "a visit your phone reports is named by the building, park or campus it was in, and by the places within your phone's margin of error: \"at Union Station\", \"near Blue Bottle Coffee\"."
      : "a visit your phone reports is named by the places within your phone's margin of error: \"near Blue Bottle Coffee\".";
    let body;
    let actions = "";
    if (job.state === "downloading") {
      body = `<p>downloading location accuracy: ${escapeHtml(bytes(job.received))} of ${escapeHtml(bytes(job.total))}. you can keep using your journal while it downloads.</p>
        <progress max="${Number(job.total) || 1}" value="${Number(job.received) || 0}"></progress>`;
    } else if (installed && status.current) {
      body = `<p>location accuracy is on. ${escapeHtml(what)}</p>`;
      actions = `<button type="button" data-accuracy="remove">remove location accuracy</button>
        <span class="map-muted">frees ${escapeHtml(bytes(installed.size_bytes))}; names go back to the nearby town.</span>`;
    } else if (installed && offered) {
      body = `<p>location accuracy is on. a newer download is ready: ${escapeHtml(bytes(offered.size_bytes))}.</p>`;
      actions = `<button type="button" data-accuracy="download">update</button>
        <button type="button" data-accuracy="remove">remove location accuracy</button>`;
    } else if (installed) {
      body = `<p>location accuracy is on.</p>`;
      actions = `<button type="button" data-accuracy="remove">remove location accuracy</button>`;
    } else {
      body = `<p>with location accuracy, ${escapeHtml(what)} without it, a visit is named by the nearby town.</p>
        <p class="map-muted">it's ${escapeHtml(bytes(offered.size_bytes))}, the same download for everyone, so getting it says nothing about where you've been. names are looked up on your computer.</p>`;
      actions = `<button type="button" data-accuracy="download">download ${escapeHtml(bytes(offered.size_bytes))}</button>`;
    }
    const failures = {
      not_enough_space: `there isn't enough free space: location accuracy needs ${bytes(offered?.size_bytes)} free, plus some room to spare.`,
      download_failed: "location accuracy couldn't be downloaded. try again in a while.",
      write_failed: "location accuracy couldn't be saved in your journal's folder.",
      nothing_offered: "this version of your journal has no location accuracy download.",
    };
    const failed = job.state === "failed"
      ? `<p class="map-muted" role="status">${escapeHtml(failures[job.reason_code] || failures.download_failed)}</p>`
      : "";
    const notices = asArray(status.notices);
    const credits = asArray(status.attributions).map((text) => `<p class="map-muted">${escapeHtml(text)}</p>`).join("")
      + (notices.length
        ? `<details class="map-why"><summary>licences</summary>${notices.map((text) => `<p class="map-muted" style="white-space: pre-line">${escapeHtml(text)}</p>`).join("")}</details>`
        : "");
    return `<section class="map-card map-accuracy" aria-label="location accuracy" data-accuracy-card>
      <h2>location accuracy</h2>${body}${failed}
      ${actions ? `<div class="map-accuracy-actions">${actions}</div>` : ""}${credits}</section>`;
  }

  function accuracyDrawn(status) {
    const installed = status?.installed;
    if (!installed) return "";
    if (installed.containment) {
      return `<p>with location accuracy, a visit can say "at" a place when your phone's whole margin of error is inside its outline, and "near" the places within that margin. "in" means the whole margin is inside a larger outline, a neighbourhood or a town. every record says why it reads the way it does.</p>`;
    }
    return `<p>with location accuracy, a visit can say "near" the places within your phone's margin of error. every record says why it reads the way it does.</p>`;
  }

  let accuracyTimer = null;

  async function accuracyAction(action, data) {
    root.querySelectorAll("[data-accuracy]").forEach((button) => { button.disabled = true; });
    try {
      const status = await window.apiJson(`/app/map/api/accuracy/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      showAccuracy(status, data);
    } catch (err) {
      if (window.logError) window.logError(err, { context: "map:accuracy" });
      const status = await window.apiJson("/app/map/api/accuracy").catch(() => null);
      showAccuracy(status, data);
    }
  }

  function showAccuracy(status, data) {
    const card = root.querySelector("[data-accuracy-card]");
    if (!card) return;
    const before = data.accuracy;
    data.accuracy = status;
    card.outerHTML = accuracyCard(status) || "<div data-accuracy-card hidden></div>";
    root.querySelectorAll("[data-accuracy]").forEach((button) => {
      button.addEventListener("click", () => accuracyAction(button.getAttribute("data-accuracy"), data));
    });
    clearTimeout(accuracyTimer);
    if (status?.job?.state === "downloading") {
      accuracyTimer = setTimeout(async () => {
        if (!root.isConnected) return;
        const next = await window.apiJson("/app/map/api/accuracy").catch(() => null);
        if (next) showAccuracy(next, data);
      }, 2000);
    } else if (before && JSON.stringify(before.installed) !== JSON.stringify(status?.installed)) {
      // Names change with the download, so the day is read again.
      loadDay(data.day);
    }
  }

  function renderDay(data) {
    const entries = asArray(data.entries);
    const devices = asArray(data.devices);
    const list = entries.map((entry, index) => renderEntry(entry, index, data)).join("");
    const mapCard = data.map
      ? `<section class="map-card map-figure-card" aria-label="map">
          <div class="map-canvas" id="map-canvas" role="region" aria-label="map of the records listed here, with towns and borders"></div>
          <p class="map-muted">named features only; streets not shown.</p>
          <p class="map-muted">towns from <a class="map-link" href="https://www.geonames.org/" rel="noopener noreferrer">GeoNames</a> (<a class="map-link" href="https://creativecommons.org/licenses/by/4.0/" rel="noopener noreferrer">CC BY 4.0</a>) · borders from Natural Earth${data.accuracy?.installed ? ` · ${data.accuracy.installed.containment ? "places and outlines" : "places"} from <a class="map-link" href="https://docs.overturemaps.org/attribution/" rel="noopener noreferrer">Overture Maps</a>` : ""}</p>
        </section>`
      : "";
    const accuracy = accuracyCard(data.accuracy) || "<div data-accuracy-card hidden></div>";
    reveal(`${devices.map((device) => renderDevice(device, data.day)).join("")}
      <div class="map-columns">
        <section class="map-card" aria-label="the day, in order">
          <div class="map-list-head"><h2>the day, in order</h2>
          <span class="map-muted">${escapeHtml(plural(entries.length, "record", "records"))}</span></div>
          <ol class="map-list">${list}</ol>
        </section>
        ${mapCard}
      </div>
      ${accuracy}
      <section class="map-card"><details class="map-details"><summary>how this is drawn</summary>
        <p>your journal draws this from the readings your phone sent it, and the names that came with your journal or that you downloaded. no map service is asked for anything.</p>
        <p>there's no street map. a street map is loaded piece by piece from a map service, and asking for the right piece tells that service where you were.</p>
        <p>without location accuracy, each reading is named after the town that best stands for its area, which isn't always the town you were in. that's why it says "near".</p>
        ${accuracyDrawn(data.accuracy)}
        <p>for readings, the times are the first and last reading in the row. they don't say how long you were anywhere.</p>
      </details></section>
      <section class="map-card"><h2>deleting any of this</h2>
        <p class="map-muted">every record above opens in transcripts, where you delete its segments the same way as any other. a deleted segment leaves this view and search.</p>
      </section>`);
    root.querySelectorAll("[data-map-show]").forEach((button) => {
      button.addEventListener("click", () => focusEntry(Number(button.getAttribute("data-map-show")), true));
    });
    root.querySelectorAll("[data-accuracy]").forEach((button) => {
      button.addEventListener("click", () => accuracyAction(button.getAttribute("data-accuracy"), data));
    });
    if (data.accuracy?.job?.state === "downloading") showAccuracy(data.accuracy, data);
    drawMap(data);
  }

  function cssColor(name, fallback) {
    const value = window.getComputedStyle?.(document.documentElement)?.getPropertyValue(name);
    return (value && value.trim()) || fallback;
  }

  function tooltipNode(text) {
    const span = document.createElement("span");
    span.textContent = text;
    return span;
  }

  function drawMap(data) {
    const L = window.L;
    const element = document.getElementById("map-canvas");
    if (!L || !element || !data.map) return;
    const ink = cssColor("--ink-soft", "#6b5f55");
    const orange = cssColor("--orange", "#e8913a");
    const map = L.map(element, { attributionControl: false, zoomSnap: 0.5, worldCopyJump: false });
    const [west, south, east, north] = data.map.bounds;
    map.fitBounds([[south, west], [north, east]], { padding: [28, 28], maxZoom: 14 });
    L.control.scale({ imperial: false }).addTo(map);
    const line = (lines, style) => asArray(lines).forEach((points) => L.polyline(points, style).addTo(map));
    asArray(data.map.countries).forEach((country) => line(country.lines, { color: ink, weight: 1.6, opacity: 0.8, interactive: false }));
    asArray(data.map.regions).forEach((region) => line(region.lines, { color: ink, weight: 1, opacity: 0.6, dashArray: "4 4", interactive: false }));
    // Only towns that carry a name are drawn: an unnamed dot says nothing.
    asArray(data.map.towns).slice(0, 15).forEach((town) => {
      const dot = L.circleMarker([town.lat, town.lon], { radius: 2.5, color: ink, weight: 1, fillColor: ink, fillOpacity: 0.9, interactive: false }).addTo(map);
      dot.bindTooltip(tooltipNode(town.name), { permanent: true, direction: "right", className: "map-town-label", offset: [4, 0] });
    });
    const layers = [];
    asArray(data.entries).forEach((entry, index) => {
      const group = L.featureGroup();
      const points = entry.kind === "readings" ? asArray(entry.points) : entry.kind === "visit" ? [entry.point] : [];
      const outline = entry.kind === "visit" ? asArray(entry.place?.at?.outline) : [];
      if (outline.length) {
        L.polygon(outline, { color: orange, weight: 1.5, dashArray: "3 3", fillColor: orange, fillOpacity: 0.06, interactive: false }).addTo(group);
      }
      points.forEach((point) => {
        const [lat, lon, accuracy] = point;
        if (Number.isFinite(accuracy) && accuracy > 25) {
          L.circle([lat, lon], { radius: accuracy, stroke: false, fillColor: orange, fillOpacity: accuracy > 500 ? 0.025 : 0.07, interactive: false }).addTo(group);
        }
        const marker = entry.kind === "visit"
          ? L.circleMarker([lat, lon], { radius: 8, color: orange, weight: 2.5, fill: false })
          : L.circleMarker([lat, lon], { radius: 3.5, color: orange, weight: 1, fillColor: orange, fillOpacity: entry.precision === "precise" ? 0.9 : 0.35 });
        marker.on("click", () => focusEntry(index, false));
        marker.addTo(group);
      });
      if (points.length) group.addTo(map);
      layers[index] = points.length ? group : null;
    });
    mapState = { map, layers };
  }

  function focusEntry(index, onMap) {
    root.querySelectorAll("[data-map-entry]").forEach((row) => {
      if (Number(row.getAttribute("data-map-entry")) === index) row.setAttribute("data-active", "");
      else row.removeAttribute("data-active");
    });
    const row = root.querySelector(`[data-map-entry="${index}"]`);
    if (!onMap) {
      row?.scrollIntoView?.({ block: "nearest", behavior: "smooth" });
      return;
    }
    const layer = mapState?.layers?.[index];
    if (layer && mapState.map) {
      mapState.map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 15 });
      document.getElementById("map-canvas")?.scrollIntoView?.({ block: "nearest", behavior: "smooth" });
    }
  }

  async function loadDay(day) {
    setGate(window.SurfaceState.loading({ text: "loading this day's location…" }));
    try {
      const data = await window.apiJson(`/app/map/api/day/${encodeURIComponent(day)}`);
      if (!root.isConnected) return;
      if (!asArray(data.entries).length && !asArray(data.devices).length) {
        if (data.journal_has_location) renderDayEmpty(data, day);
        else renderJournalEmpty();
        return;
      }
      renderDay(data);
    } catch (err) {
      showError(err, () => loadDay(day));
    }
  }

  async function start() {
    const { day } = window.solPathContext ? window.solPathContext() : {};
    if (DAY_RE.test(String(day || ""))) {
      await loadDay(day);
      return;
    }
    setGate(window.SurfaceState.loading({ text: "loading your journal's location…" }));
    try {
      const index = await window.apiJson("/app/map/api/index");
      const end = index?.coverage?.end;
      if (DAY_RE.test(String(end || ""))) {
        window.location.replace(`/app/map/${end}`);
        return;
      }
      renderJournalEmpty();
    } catch (err) {
      showError(err, start);
    }
  }

  window.__mapWorkspace = { start, renderDay, entryTitle, entryTime, entryMeta, entryWhere, entryWhy, accuracyCard, moment };
  start();
})();
</script>
